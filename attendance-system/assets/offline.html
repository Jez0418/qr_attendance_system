<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>You're offline - Attendance</title>
<!-- Served by the service worker (sw.php) when a page can't load. Self-contained: it may be shown
     at any URL, so it can't rely on relative links to style.css. Colours follow style.css tokens. -->
<style>
    :root{--bg:#eef4ff;--surface:#fff;--ink:#0e1a33;--muted:#475569;--accent:#1d6bf3;--line:#e8eef7}
    @media (prefers-color-scheme:dark){:root{--bg:#0a1328;--surface:#16223b;--ink:#f2f5fb;--muted:#aab6cc;--accent:#4a8cf7;--line:#233253}}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);
         font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    main{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:32px 28px;text-align:center}
    svg{width:48px;height:48px;color:var(--accent);margin-bottom:12px}
    h1{font-size:20px;margin:0 0 8px;text-wrap:balance}
    p{margin:0 0 22px;color:var(--muted);font-size:14.5px;line-height:1.55}
    button{font:inherit;font-weight:700;font-size:14px;border:0;border-radius:999px;padding:11px 26px;background:#1d6bf3;color:#fff;cursor:pointer}   /* same blue in both themes: 4.6:1 with white */
    button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.6a10 10 0 0 1 9.4-2.5"/><path d="M8.5 16.4a5 5 0 0 1 4.6-1.3"/><path d="M12 20h.01"/><path d="m16 15 5 5m0-5-5 5"/>
    </svg>
    <h1>You're offline</h1>
    <p>Attendance needs a connection to check your location and record your scan. Turn on mobile data or Wi-Fi, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
